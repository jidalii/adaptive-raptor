# Cascade first stage on train: answer + evidence-sufficiency flag in ONE call
# (prompt qasper_sufficiency_v1) for leaf_only@400 and leaf_only@1000. Purpose: calibrate the trigger (train only).
# Stage-2 answers are NOT re-generated: they are the stored qasper_default answers of
# leaf_only@1000/@2000 in labels_train (same prompt as the fixed baselines).
# Indexes are cached (cap 200) -> no summarization calls; run label S keeps these rows apart
# from the run-A label tables.
# COSTS MONEY (answers only):
#   uv run python -m adaptive_raptor.run --config configs/experiments/cascade_stage1_train.yaml
# Analysis (offline): uv run python scripts/analyze_cascade.py --help
experiment:
  name: cascade_stage1_train
  type: raptor_baseline
  run_label: S
  description: "Cascade stage 1 (train, 340 papers, 1,019 questions): answer + sufficiency flag at leaf_only@400/1000."

dataset:
  name: qasper
  split: train
  doc_ids_file: data/subsets/qasper/v0.3/train_router.txt

chunking:
  variants:
    - {name: f100, method: fixed, chunk_size: 100}

raptor:
  summarization_length: 200          # must match the cached indexes (no rebuild)

retrieval:
  include_raptor_original: false
  strategies: [leaf_only]
  budgets: [400, 1000]

generation:
  prompt_template: qasper_sufficiency_v1
  price_input_per_mtok: 0.15
  price_output_per_mtok: 0.60

evaluation:
  save_contexts: false
  output_formats: [csv, json]

runtime:
  concurrency: 8
