# E1 / H1: router vs. dev-selected best fixed (strategy, budget) at matched average tokens.
# Dev run: theta is calibrated to target_mean_tokens. For the test run, set
# dataset.split=test and optimizer.checkpoint to the frozen router.
experiment:
  name: h1_router_f100
  type: h1_optimizer
  seed: 0
  description: Iso-budget evaluation of the query-aware router on the F-100 index.

dataset:
  name: qasper
  split: dev

chunking:
  variants:
    - {name: f100, method: fixed, chunk_size: 100}

retrieval:
  strategies: [leaf_only, summary_only, collapsed]
  budgets: [400, 1000, 2000]

optimizer:
  enabled: true
  model_type: logistic_regression
  features: [query_embedding, lexical]
  pca_dim: 32
  regularization_c: 1.0
  label_epsilon: 0.05
  target_mean_tokens: 1000
  fallback: {strategy: collapsed, budget: 2000}

evaluation:
  metrics: [answer_f1, context_tokens, latency]
  baselines: [best_fixed, raptor_default]
  budget_matching: conservative_at_least
  bootstrap_samples: 2000
  confidence_level: 0.95
